// Hellmacs test fixture: a small Gradle Groovy project with JUnit tests.
plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'dev.hellmacs.demo.App'
}

tasks.named('test') {
    useJUnitPlatform()
    // BrokenTest only runs (and fails) with -Dhellmacs.fail=true.
    systemProperty 'hellmacs.fail', System.getProperty('hellmacs.fail', 'false')
}
