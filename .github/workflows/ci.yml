name: Hellmacs CI

# Hellmacs has no test suites (test/ was removed on 2026-09-30). CI
# installs it the way a user does, checks it with doctor, and reports the
# licenses and the bill of materials of everything installed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install & doctor (Emacs ${{ matrix.emacs-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Emacs Hellmacs supports, and the newest release.
        emacs-version: ['29.1', '30.1']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find zstd openssl unzip
          mkdir -p ~/.local/bin
          ln -sf $(which fdfind) ~/.local/bin/fd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # As a user would: creates the config, syncs, saves the environment,
      # and runs doctor.
      - name: Install
        run: bin/hellmacs install --env

      - name: Doctor
        run: bin/hellmacs doctor

      # 12.9: a dependency whose license isn't known fails here, before it
      # ships; the bill of materials is kept with the run.
      - name: License report
        run: bin/hellmacs licenses

      - name: Bill of materials (CycloneDX)
        run: bin/hellmacs sbom sbom.json

      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom-emacs-${{ matrix.emacs-version }}-${{ github.run_number }}
          path: sbom.json
