name: Hellmacs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, Emacs ${{ matrix.emacs-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        emacs-version: ['29.1', '29.4', '30.1']
        include:
          - os: ubuntu-latest
            emacs-version: 'snapshot'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find zstd openssl
          mkdir -p ~/.local/bin
          ln -sf $(which fdfind) ~/.local/bin/fd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep fd zstd openssl
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Run unit test suite
        run: bin/hellmacs test

  doctor-and-bundle:
    name: Doctor & Offline Bundle Verification
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find zstd openssl
          mkdir -p ~/.local/bin
          ln -sf $(which fdfind) ~/.local/bin/fd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install and Sync
        run: |
          bin/hellmacs install --env
          bin/hellmacs sync

      - name: Run Doctor Check
        run: bin/hellmacs doctor

      # 12.9: a dependency whose license isn't known fails here, before it
      # ships; the bill of materials is kept with the run.
      - name: License report
        run: bin/hellmacs licenses

      - name: Bill of materials (CycloneDX)
        run: bin/hellmacs sbom sbom.json

      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.json

      - name: Run Network & Bundle E2E Test
        run: emacs --batch -l early-init.el -l init.el -l test/integration/net-e2e.el

  integration-e2e:
    name: Nightly E2E Integration (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find zstd openssl
          mkdir -p ~/.local/bin
          ln -sf $(which fdfind) ~/.local/bin/fd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep fd zstd openssl
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Install & Sync
        run: |
          bin/hellmacs install --env
          bin/hellmacs sync

      - name: Java E2E (Maven)
        run: HELLMACS_E2E_FIXTURE=maven-demo emacs --batch -l early-init.el -l init.el -l test/integration/java-e2e.el

      - name: Java E2E (Gradle)
        run: HELLMACS_E2E_FIXTURE=gradle-demo emacs --batch -l early-init.el -l init.el -l test/integration/java-e2e.el

      - name: Modeline E2E
        run: emacs --batch -l early-init.el -l init.el -l test/integration/modeline-e2e.el
