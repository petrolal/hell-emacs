name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the oldest Emacs Hell Emacs supports (early-init.el).
        emacs: ['29.1', '30.1', snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile (warnings are errors)
        run: make compile
      - name: Test
        run: make test
      - name: Checkdoc (advisory)
        run: make checkdoc
