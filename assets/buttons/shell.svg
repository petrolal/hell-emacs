<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Terminal Frame -->
  <rect x="3" y="4" width="18" height="16" fill="#1f2430" rx="1"/>
  <rect x="3" y="4" width="18" height="16" fill="none" stroke="#50fa7b" stroke-width="1"/>
  <!-- Header Bar -->
  <rect x="3" y="4" width="18" height="3" fill="#50fa7b"/>
  <rect x="5" y="5" width="1" height="1" fill="#15161b"/>
  <rect x="7" y="5" width="1" height="1" fill="#15161b"/>
  <!-- Rune Prompt: >_ -->
  <rect x="6" y="10" width="2" height="2" fill="#50fa7b"/>
  <rect x="8" y="12" width="2" height="2" fill="#50fa7b"/>
  <rect x="6" y="14" width="2" height="2" fill="#50fa7b"/>
  <!-- Flashing Cursor -->
  <rect x="12" y="14" width="5" height="2" fill="#ff5555"/>
</svg>
