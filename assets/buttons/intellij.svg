<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- IntelliJ Outer Black Square Box -->
  <rect x="3" y="3" width="18" height="18" fill="#15161b" stroke="#ff5555" stroke-width="1"/>
  <!-- IJ Cyan/Pink Neon Corner Accent -->
  <rect x="4" y="4" width="5" height="2" fill="#bd93f9"/>
  <rect x="4" y="6" width="2" height="3" fill="#bd93f9"/>
  <!-- The 'I' Glyph -->
  <rect x="6" y="9" width="2" height="7" fill="#f8f8f2"/>
  <!-- The 'J' Glyph with Demon Tail -->
  <rect x="12" y="9" width="2" height="5" fill="#f8f8f2"/>
  <rect x="10" y="14" width="4" height="2" fill="#f8f8f2"/>
  <rect x="9" y="13" width="2" height="2" fill="#f8f8f2"/>
  <!-- Subjugation Cross-Slash / Underscore Cursor -->
  <rect x="7" y="18" width="10" height="2" fill="#50fa7b"/>
</svg>
